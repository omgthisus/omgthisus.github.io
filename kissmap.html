<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>u found da map!!!</title>
    <style>
        /* Fond noir et police pixelisée */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', 'Silkscreen', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Titre style rétro */
        h1 {
            color: #0ff; /* Cyan néon */
            text-shadow: 0 0 10px #0ff;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* Conteneur de la carte avec bordure néon */
        .map-container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
            border: 3px solid #0ff; /* Bordure cyan */
            border-radius: 0; /* Pas d'arrondi pour un look pixel */
            overflow: hidden;
            box-shadow: 0 0 20px #0ff;
        }

        /* Style de l'IFRAME */
        .map-container iframe {
            width: 100%;
            height: 400px;
            border: none;
            background-color: #111; /* Fond légèrement gris pour contraster avec le noir */
        }

        /* Texte supplémentaire (optionnel) */
        p {
            color: #0f0; /* Vert néon */
            font-size: 12px;
            margin-top: 20px;
        }

        /* Lien pour ouvrir la carte en plein écran */
        .fullscreen-link {
            display: inline-block;
            margin-top: 20px;
            color: #f0f; /* Magenta néon */
            text-decoration: none;
            font-size: 14px;
        }
        .fullscreen-link:hover {
            text-shadow: 0 0 10px #f0f;
        }
    </style>

    <!-- Charger la police pixelisée depuis Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <h1>DA KISSMAP!!!</h1>

    <div class="map-container">
       <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1QjaojYanxaWF-KAaP9Q1-X2ob0H8GpM&ehbc=2E312F&noprof=1" width="640" height="480">
            allowfullscreen
            loading="lazy">
        </iframe>
    </div>

</body>
</html>
