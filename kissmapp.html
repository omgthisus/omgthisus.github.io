<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kissmaaaaap</title>
    <style>
        /* Style pour la vignette */
        .map-container {
            width: 100%;
            max-width: 800px; /* Taille maximale de la vignette */

            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

        .map-container iframe {
            width: 100%;
            height: 400px; /* Hauteur fixe pour la vignette */
            border: none;
        }
        h1 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>DA KISSMAP!!!</h1>

            allowfullscreen
            loading="lazy">
        </iframe>
    </div>
</body>
</html>
